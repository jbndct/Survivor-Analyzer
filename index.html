<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survivor Analytics Engine: Director's Cut</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #e0e0e0; }
    h1, h2, h3, h4, h5, .brand-font { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
    .recap-text { font-family: 'Lora', serif; font-size: 1.15rem; line-height: 1.8; color: #cccccc; }
    .confessional-wrapper { background: linear-gradient(90deg, rgba(255,87,34,0.1) 0%, rgba(10,10,10,0) 100%); border-left: 5px solid #ff5722; padding: 20px; border-radius: 4px; }
    .confessional-text { font-family: 'Lora', serif; font-size: 1.4rem; font-style: italic; color: #ffffff; }
    .confessional-author { font-family: 'Oswald', sans-serif; color: #ff5722; text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem; margin-top: 10px; }
    
    .cinematic-header { background: linear-gradient(180deg, #1f0b0b 0%, #0a0a0a 100%); border-bottom: 2px solid #ff4500; }
    .card { background-color: #161616; border: 1px solid #2a2a2a; }
    .rating-box { background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; }
    
    .text-torch { color: #ff5722 !important; }
    .bg-torch { background-color: #ff5722 !important; color: white; }
    .btn-torch { background-color: #ff4500; border-color: #ff4500; color: white; text-transform: uppercase; font-weight: bold; font-family: 'Oswald', sans-serif; letter-spacing: 1px;}
    .btn-torch:hover { background-color: #e63e00; border-color: #e63e00; color: white; }
    
    .edgic-table th, .edgic-table td { text-align: center; vertical-align: middle; padding: 0.5rem; border: 1px solid #333; white-space: nowrap;}
    .edgic-table th { background-color: #1a1a1a; font-family: 'Oswald', sans-serif; font-size: 0.85rem;}
    .edgic-cell { font-weight: bold; font-size: 0.85rem; font-family: 'Oswald', sans-serif; }
    
    /* Edgic Color Coding */
    .edgic-cp { color: #4fc3f7; } /* Light Blue */
    .edgic-ott { color: #ef5350; } /* Red */
    .edgic-utr { color: #fff176; } /* Yellow */
    .edgic-mor { color: #81c784; } /* Green */
    .edgic-inv { color: #757575; } /* Grey */
    .edgic-out { background-color: #b71c1c !important; color: white !important; border-color: #b71c1c !important; }
  </style>
</head>
<body>

  <nav class="navbar cinematic-header py-3 shadow-lg">
    <div class="container-fluid px-4">
      <span class="navbar-brand mb-0 h1 fs-3 text-torch"><i class="bi bi-fire me-2"></i>Survivor Engine: Director's Cut</span>
    </div>
  </nav>

  <div class="bg-dark border-bottom border-secondary py-3 mb-4 shadow-sm">
    <div class="container-fluid px-4">
      <div class="row g-2 align-items-center">
        <div class="col-auto"><span class="brand-font text-muted small"><i class="bi bi-gear-fill me-2"></i>API CONFIG</span></div>
        <div class="col-md-3"><input type="text" id="supabaseUrl" class="form-control form-control-sm bg-black text-light border-dark" placeholder="Supabase URL"></div>
        <div class="col-md-3"><input type="password" id="supabaseKey" class="form-control form-control-sm bg-black text-light border-dark" placeholder="Supabase Anon Key"></div>
        <div class="col-md-3"><input type="password" id="geminiKey" class="form-control form-control-sm bg-black text-light border-dark" placeholder="Gemini API Key"></div>
        <div class="col-auto"><button onclick="saveCredentials()" class="btn btn-outline-secondary btn-sm brand-font">Save Keys</button></div>
      </div>
    </div>
  </div>

  <div class="container-fluid px-4 mb-5">
    <div class="row">
      <div class="col-xl-3 col-lg-4 mb-4">
        
        <div class="card p-4 mb-4" style="border-top: 3px solid #ff5722 !important;">
          <h5 class="brand-font text-torch mb-3">Franchise Control</h5>
          <button class="btn btn-dark border-secondary w-100 mb-4 brand-font btn-sm" onclick="createNewFranchise()"><i class="bi bi-plus-circle me-2"></i>New Franchise</button>
          
          <div class="mb-3">
            <select id="franchiseSelect" class="form-select form-select-sm bg-black text-light border-secondary brand-font" onchange="loadSeasons()"></select>
          </div>
          <div class="input-group input-group-sm mb-4">
            <select id="seasonSelect" class="form-select bg-black text-light border-secondary brand-font" onchange="loadSeasonData()"></select>
            <button class="btn btn-secondary" onclick="createNewSeason()"><i class="bi bi-plus-lg"></i></button>
          </div>

          <div class="p-3 bg-black rounded border border-dark">
            <div class="small text-success mb-1 brand-font">AI Core Memory (Season Context)</div>
            <p id="contextSeason" class="small text-muted mb-0 fst-italic">No season selected.</p>
          </div>
        </div>

        <div class="card p-4 h-100 border-0 shadow-lg" style="background: linear-gradient(180deg, #161616 0%, #0a0a0a 100%);">
          <h5 class="brand-font text-torch mb-3"><i class="bi bi-grid-3x3 me-2"></i>Season Edgic Matrix</h5>
          <div class="table-responsive">
            <table class="table table-dark table-sm edgic-table" id="edgicTable">
              <thead><tr id="edgicHeader"><th>Castaway</th></tr></thead>
              <tbody id="edgicBody"><tr><td class="text-muted small">Generate episodes to build matrix.</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-xl-9 col-lg-8">
        
        <div class="card p-4 border-0 mb-5 bg-dark shadow-lg">
          <h4 class="brand-font mb-3 text-light"><i class="bi bi-file-earmark-text me-2 text-torch"></i>Ingest Simulation Data</h4>
          <textarea id="rawLogData" class="form-control bg-black text-light border-dark mb-3" rows="5" placeholder="Paste the chronological text dump for this episode here..."></textarea>
          
          <div class="d-flex justify-content-between align-items-center">
            <div class="input-group w-25">
              <span class="input-group-text bg-secondary text-light border-secondary brand-font">EPISODE</span>
              <input type="number" id="nextEpNumber" class="form-control bg-black text-light border-secondary text-center fw-bold fs-5" readonly>
            </div>
            <button id="processBtn" onclick="processEpisode()" class="btn btn-torch px-5 py-2 shadow-lg fs-5">
              <i class="bi bi-camera-reels-fill me-2"></i>Generate TV Edit
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-end mb-3 mt-4 border-bottom border-secondary pb-2">
          <h3 class="brand-font text-light mb-0"><i class="bi bi-film me-2 text-torch"></i>Episodic Archives</h3>
          <button id="undoBtn" class="btn btn-sm btn-outline-danger brand-font" onclick="deleteLatestEpisode()" style="display:none;">
            <i class="bi bi-rewind-fill me-1"></i>Delete Latest Episode
          </button>
        </div>
        
        <div id="episodesContainer"></div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let currentFranchises = [];
    let currentSeasons = [];
    let activeFranchiseId = null;
    let activeSeasonId = null;
    let latestEpisodeId = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadSavedCredentials();
      if (checkCredentialsReady()) loadFranchises();
    });

    function loadSavedCredentials() {
      document.getElementById('supabaseUrl').value = localStorage.getItem('srv_sbUrl') || '';
      document.getElementById('supabaseKey').value = localStorage.getItem('srv_sbKey') || '';
      document.getElementById('geminiKey').value = localStorage.getItem('srv_gemKey') || '';
    }

    function saveCredentials() {
      localStorage.setItem('srv_sbUrl', document.getElementById('supabaseUrl').value.trim());
      localStorage.setItem('srv_sbKey', document.getElementById('supabaseKey').value.trim());
      localStorage.setItem('srv_gemKey', document.getElementById('geminiKey').value.trim());
      alert('Keys saved to browser storage.');
      if (checkCredentialsReady()) loadFranchises();
    }

    function checkCredentialsReady() { return document.getElementById('supabaseUrl').value && document.getElementById('supabaseKey').value && document.getElementById('geminiKey').value; }

    async function supabaseRequest(endpoint, method = 'GET', body = null, selectQuery = '') {
      const url = document.getElementById('supabaseUrl').value.trim();
      const key = document.getElementById('supabaseKey').value.trim();
      let targetUrl = `${url}/rest/v1/${endpoint}`;
      if (selectQuery) targetUrl += `?${selectQuery}`;

      const options = { method, headers: { 'apikey': key, 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json', 'Prefer': method === 'POST' ? 'return=representation' : '' }};
      if (body) options.body = JSON.stringify(body);
      
      const res = await fetch(targetUrl, options);
      if (!res.ok) throw new Error(await res.text());
      const text = await res.text();
      return text ? JSON.parse(text) : true;
    }

    async function loadFranchises() {
      currentFranchises = await supabaseRequest('franchises', 'GET', null, 'order=created_at.desc');
      const select = document.getElementById('franchiseSelect');
      select.innerHTML = currentFranchises.map(f => `<option value="${f.id}">${f.name}</option>`).join('');
      if (currentFranchises.length > 0) select.dispatchEvent(new Event('change'));
    }

    async function createNewFranchise() {
      const name = prompt("Enter Franchise Name:");
      if (!name) return;
      await supabaseRequest('franchises', 'POST', { name });
      await loadFranchises();
    }

    async function loadSeasons() {
      const fId = document.getElementById('franchiseSelect').value;
      if (!fId) return;
      activeFranchiseId = fId;
      currentSeasons = await supabaseRequest('seasons', 'GET', null, `franchise_id=eq.${fId}&order=season_number.asc`);
      const select = document.getElementById('seasonSelect');
      select.innerHTML = currentSeasons.map(s => `<option value="${s.id}">Season ${s.season_number}</option>`).join('');
      if (currentSeasons.length > 0) select.dispatchEvent(new Event('change'));
    }

    async function createNewSeason() {
      if (!activeFranchiseId) return;
      await supabaseRequest('seasons', 'POST', { franchise_id: activeFranchiseId, season_number: currentSeasons.length + 1 });
      await loadSeasons();
    }

    async function loadSeasonData() {
      activeSeasonId = document.getElementById('seasonSelect').value;
      document.getElementById('contextSeason').innerText = currentSeasons.find(s => s.id === activeSeasonId)?.season_context || 'A new season begins.';
      await loadEpisodes(activeSeasonId);
    }

    function getEdgicColorClass(rating) {
      if (!rating) return '';
      const r = rating.toUpperCase();
      if (r.includes('CP')) return 'edgic-cp';
      if (r.includes('OTT')) return 'edgic-ott';
      if (r.includes('UTR')) return 'edgic-utr';
      if (r.includes('MOR')) return 'edgic-mor';
      if (r.includes('INV')) return 'edgic-inv';
      return '';
    }

    function renderEdgicMatrix(episodes) {
      const header = document.getElementById('edgicHeader');
      const body = document.getElementById('edgicBody');
      
      if(episodes.length === 0) {
        header.innerHTML = `<th>Castaway</th>`;
        body.innerHTML = `<tr><td class="text-muted small">No data yet.</td></tr>`;
        return;
      }

      const chronos = [...episodes].sort((a, b) => a.episode_number - b.episode_number);
      
      // Extract all unique players who have received a rating or been eliminated
      const playersSet = new Set();
      chronos.forEach(ep => {
        if(ep.edgic_ratings) ep.edgic_ratings.forEach(r => playersSet.add(r.player));
        if(ep.eliminated_player && ep.eliminated_player !== "None") playersSet.add(ep.eliminated_player);
      });
      const players = Array.from(playersSet).sort();

      let headHtml = `<th>Castaway</th>`;
      chronos.forEach(ep => headHtml += `<th>Ep ${ep.episode_number}</th>`);
      header.innerHTML = headHtml;

      let bodyHtml = '';
      players.forEach(player => {
        let isEliminated = false;
        bodyHtml += `<tr><td class="text-start text-light brand-font">${player}</td>`;
        
        chronos.forEach(ep => {
          if (isEliminated) {
            bodyHtml += `<td class="edgic-cell bg-dark border-dark"></td>`;
            return;
          }

          if (ep.eliminated_player === player) {
             bodyHtml += `<td class="edgic-cell edgic-out">OUT</td>`;
             isEliminated = true;
          } else {
             let rating = "-";
             let colorClass = "";
             if(ep.edgic_ratings) {
               const pr = ep.edgic_ratings.find(r => r.player === player);
               if(pr) {
                 rating = pr.rating;
                 colorClass = getEdgicColorClass(rating);
               }
             }
             bodyHtml += `<td class="edgic-cell ${colorClass}">${rating}</td>`;
          }
        });
        bodyHtml += `</tr>`;
      });
      body.innerHTML = bodyHtml;
    }

    async function loadEpisodes(seasonId) {
      const episodes = await supabaseRequest('episodes', 'GET', null, `season_id=eq.${seasonId}&order=episode_number.desc`);
      const container = document.getElementById('episodesContainer');
      const undoBtn = document.getElementById('undoBtn');
      
      renderEdgicMatrix(episodes);

      if (episodes.length === 0) {
        container.innerHTML = `<div class="text-center py-5 text-muted border border-secondary border-dashed rounded"><i class="bi bi-film fs-1 mb-3"></i><p>Awaiting simulation data for Episode 1.</p></div>`;
        document.getElementById('nextEpNumber').value = 1;
        undoBtn.style.display = 'none';
        latestEpisodeId = null;
        return;
      }

      document.getElementById('nextEpNumber').value = episodes[0].episode_number + 1;
      latestEpisodeId = episodes[0].id;
      undoBtn.style.display = 'inline-block';

      container.innerHTML = episodes.map(ep => {
        const superlatives = ep.superlatives || [];
        
        let chaosColor = 'bg-success';
        if(ep.chaos_index >= 5) chaosColor = 'bg-warning';
        if(ep.chaos_index >= 8) chaosColor = 'bg-danger';

        const formattedRecap = (ep.episode_recap || '').split('\n').map(p => `<p>${p}</p>`).join('');

        let confQuote = "";
        let confAuthor = "CASTAWAY";
        
        if (ep.confessional) {
          if (typeof ep.confessional === 'string') {
            try {
              // Try to parse if it was saved as a raw string
              const parsed = JSON.parse(ep.confessional);
              confQuote = parsed.quote || ep.confessional;
              confAuthor = parsed.author || "CASTAWAY";
            } catch (e) {
              // Fallback if it's just a normal string
              confQuote = ep.confessional;
            }
          } else if (typeof ep.confessional === 'object') {
            confQuote = ep.confessional.quote;
            confAuthor = ep.confessional.author;
          }
        }

        return `
          <div class="card mb-5 shadow-lg border-0 overflow-hidden">
            <div class="card-header bg-black border-bottom border-secondary py-3 d-flex justify-content-between align-items-center">
              <div>
                <span class="text-torch brand-font me-3 fs-5">EPISODE ${ep.episode_number}</span>
                <span class="fs-4 text-white brand-font">"${ep.episode_title || 'Untitled'}"</span>
              </div>
              <span class="badge bg-danger fs-6 brand-font py-2 px-3"><i class="bi bi-fire me-2"></i>VOTED OUT: ${ep.eliminated_player || 'NONE'}</span>
            </div>
            
            <div class="card-body p-4 p-md-5">
              
              <div class="row mb-5 align-items-center">
                <div class="col-lg-8">
                  <div class="recap-text pe-md-4">${formattedRecap}</div>
                </div>
                <div class="col-lg-4 mt-4 mt-lg-0">
                  <div class="confessional-wrapper">
                    <div class="confessional-text">"${ep.confessional.quote || ep.confessional}"</div>
                    <div class="confessional-author">— ${ep.confessional.author || 'Castaway'}</div>
                  </div>
                </div>
              </div>

              <div class="row g-4">
                <div class="col-xl-8">
                  <h6 class="brand-font text-torch mb-3 border-bottom border-secondary pb-2"><i class="bi bi-trophy-fill me-2"></i>Narrative Superlatives</h6>
                  <div class="row g-3">
                    ${superlatives.map(s => `
                      <div class="col-md-4">
                        <div class="p-3 bg-black border border-dark rounded h-100 shadow-sm">
                          <div class="text-torch brand-font small mb-1">${s.award}</div>
                          <div class="text-white fw-bold fs-5 mb-2">${s.recipient}</div>
                          <div class="small text-muted" style="line-height: 1.4;">${s.reason}</div>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>
                
                <div class="col-xl-4">
                  <h6 class="brand-font text-torch mb-3 border-bottom border-secondary pb-2"><i class="bi bi-bar-chart-line-fill me-2"></i>Episode Metrics</h6>
                  <div class="p-3 bg-black border border-dark rounded shadow-sm">
                    <div class="d-flex justify-content-between text-muted small brand-font mb-1"><span>Strategy</span> <span class="text-light">${ep.strategic_rating}/10</span></div>
                    <div class="progress mb-3 bg-dark border border-secondary" style="height: 6px;"><div class="progress-bar bg-primary" style="width: ${ep.strategic_rating * 10}%"></div></div>
                    
                    <div class="d-flex justify-content-between text-muted small brand-font mb-1"><span>Entertainment</span> <span class="text-light">${ep.entertainment_rating}/10</span></div>
                    <div class="progress mb-4 bg-dark border border-secondary" style="height: 6px;"><div class="progress-bar bg-info" style="width: ${ep.entertainment_rating * 10}%"></div></div>
                    
                    <div class="d-flex justify-content-between text-torch small brand-font mb-1"><span>Chaos Index</span> <span class="text-light">${ep.chaos_index}/10</span></div>
                    <div class="progress bg-dark border border-secondary" style="height: 12px;"><div class="progress-bar ${chaosColor} progress-bar-striped progress-bar-animated" style="width: ${ep.chaos_index * 10}%"></div></div>
                  </div>
                </div>
              </div>

            </div>
          </div>`;
      }).join('');
    }

    async function deleteLatestEpisode() {
      if(!latestEpisodeId || !confirm("Erase this episode from the timeline and revert AI memory?")) return;
      try {
        const epData = await supabaseRequest(`episodes`, 'GET', null, `id=eq.${latestEpisodeId}`);
        await supabaseRequest(`seasons?id=eq.${activeSeasonId}`, 'PATCH', { season_context: epData[0].previous_season_context });
        await supabaseRequest(`episodes?id=eq.${latestEpisodeId}`, 'DELETE');
        await loadSeasons();
      } catch (err) { alert(`Delete Failed: ${err.message}`); }
    }

    async function processEpisode() {
      const logData = document.getElementById('rawLogData').value.trim();
      if (!logData) return alert('Paste simulation data first.');

      const btn = document.getElementById('processBtn');
      btn.disabled = true; btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Directing Episode...`;

      try {
        const key = document.getElementById('geminiKey').value.trim();
        const epNum = parseInt(document.getElementById('nextEpNumber').value);
        const activeSeason = currentSeasons.find(s => s.id === activeSeasonId);
        const currentMemory = activeSeason.season_context;

        const promptText = `You are the Executive Producer and Story Editor for a dramatic reality TV show. 
        CRITICAL: Ignore first-person pronouns ("You"). Act exclusively as an outside viewer. Write with narrative flair, highlighting paranoia, betrayals, and camp dynamics.
        
        Episode ${epNum}. Season Memory So Far: ${currentMemory}
        Raw Simulation Log: """${logData}"""
        
        Output strictly valid JSON matching this schema exactly:
        {
          "episode_title": "Creative 2-4 word dramatic title",
          "confessional": {
             "quote": "Invent a highly realistic, dramatic confessional quote.",
             "author": "Name of the player"
          },
          "episode_recap": "Write a dramatic, multi-paragraph TV recap (300-500 words). Focus on the storyline, the shifting alliances, and the tension at tribal council. Use \\n\\n for paragraph breaks. Add emojis and make it visually appealing. ",
          "superlatives": [
            {"award": "The Mastermind", "recipient": "Player/Tribe", "reason": "1-2 sentences."},
            {"award": "The Camp Mess", "recipient": "Player/Tribe", "reason": "1-2 sentences."},
            {"award": "The Silent Assassin", "recipient": "Player/Tribe", "reason": "1-2 sentences."}
          ],
          "strategic_rating": 1-10, "entertainment_rating": 1-10, "production_rating": 1-10,
          "chaos_index": 1-10,
          "edgic_ratings": [
            {"player": "Name", "rating": "CP5"}
          ],
          "eliminated_player": "Name (or None)",
          "updated_season_context": "Update the core memory for the AI. Strict cold hard facts: who is in what alliance, who holds idols. STRICT MAX 3 SENTENCES."
        }`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
        });

        if (!response.ok) throw new Error(await response.text());
        const resData = await response.json();
        let rawAi = resData.candidates[0].content.parts[0].text.trim().replace(/```json/g, "").replace(/```/g, "").trim();
        const aiJson = JSON.parse(rawAi);

        await supabaseRequest('episodes', 'POST', {
          season_id: activeSeasonId, episode_number: epNum, previous_season_context: currentMemory,
          episode_title: aiJson.episode_title, confessional: aiJson.confessional, episode_recap: aiJson.episode_recap,
          superlatives: aiJson.superlatives, strategic_rating: aiJson.strategic_rating, 
          entertainment_rating: aiJson.entertainment_rating, production_rating: aiJson.production_rating,
          chaos_index: aiJson.chaos_index, edgic_ratings: aiJson.edgic_ratings, eliminated_player: aiJson.eliminated_player
        });

        await supabaseRequest(`seasons?id=eq.${activeSeasonId}`, 'PATCH', { season_context: aiJson.updated_season_context });
        document.getElementById('rawLogData').value = '';
        await loadSeasons(); 
        
      } catch (err) { alert(`Error: ${err.message}`); } finally {
        btn.disabled = false; btn.innerHTML = `<i class="bi bi-camera-reels-fill me-2"></i>Generate TV Edit`;
      }
    }
  </script>
</body>
</html>
